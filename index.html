<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2eb">
  <title>My Portfolio</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20231f;
      background: #f5f2eb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main {
      width: min(100%, 720px);
      padding: clamp(2rem, 8vw, 5rem);
      border: 1px solid #dcd8ce;
      border-radius: 1.5rem;
      background: #fffefa;
      box-shadow: 0 1.5rem 4rem rgb(44 43 35 / 8%);
    }
    .eyebrow {
      margin: 0 0 1rem;
      color: #687258;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.75rem, 9vw, 5rem);
      letter-spacing: -.06em;
      line-height: 1;
    }
    .intro {
      max-width: 34rem;
      margin: 1.5rem 0 0;
      color: #55584f;
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little about my work</p>
    <h1>My Portfolio</h1>
    <p class="intro">Welcome to my portfolio, where I share my projects, creativity, and things I have learned.</p>
  </main>
</body>
</html>
